name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o dairyfuture-admin-android-ready.zip -d .

      - name: Fix PaymentSmsReceiver context bug
        run: |
          sed -i 's/SharedPreferences prefs = getSharedPreferences(/SharedPreferences prefs = context.getSharedPreferences(/' dairyfuture-main/android/app/src/main/java/com/dairyfuture/admin/PaymentSmsReceiver.java

      - name: Add Google OAuth deep link intent filter
        run: |
          sed -i '/<\/activity>/i\
            <intent-filter>\
                <action android:name="android.intent.action.VIEW" />\
                <category android:name="android.intent.category.DEFAULT" />\
                <category android:name="android.intent.category.BROWSABLE" />\
                <data android:scheme="com.dairyfuture.app" />\
            </intent-filter>' dairyfuture-main/android/app/src/main/AndroidManifest.xml

      - name: Fix voice entry permission API
        run: |
          sed -i "s/NativeSpeechRecognition\.hasPermissions()/NativeSpeechRecognition.checkPermissions()/" dairyfuture-main/src/hooks/useVoiceEntry.ts
          sed -i "s/if (!hasPerm?\.speechRecognition) {/if (hasPerm?.speechRecognition !== 'granted') {/" dairyfuture-main/src/hooks/useVoiceEntry.ts
          sed -i "s/if (!req?\.speechRecognition) {/if (req?.speechRecognition !== 'granted') {/" dairyfuture-main/src/hooks/useVoiceEntry.ts

      - name: Switch to capgo continuous speech recognition plugin
        run: |
          python3 -c "
          path = 'dairyfuture-main/src/hooks/useVoiceEntry.ts'
          f = open(path); content = f.read(); f.close()

          old_import = \"import { SpeechRecognition as NativeSpeechRecognition } from '@capacitor-community/speech-recognition';\"
          new_import = \"import { SpeechRecognition as NativeSpeechRecognition } from '@capgo/capacitor-speech-recognition';\"
          assert old_import in content, 'import not found'
          content = content.replace(old_import, new_import, 1)

          old_block = \"        await NativeSpeechRecognition.addListener('partialResults', (data: { matches?: string[] }) => {\n          const matches = data.matches || [];\n          if (!matches.length) return;\n\n          // Check supplier command first\n          let supplierMatched = false;\n          for (const transcript of matches) {\n            const code = parseSupplierCommand(transcript, totalSuppliersRef.current);\n            if (code !== null) {\n              supplierCbRef.current?.(code);\n              setError(null);\n              supplierMatched = true;\n              break;\n            }\n          }\n          if (supplierMatched) return;\n\n          // Check milk quantity\n          for (const transcript of matches) {\n            const value = parseSpokenNumber(transcript);\n            if (value !== null) {\n              fire(value);\n              break;\n            }\n          }\n        });\n\n        await NativeSpeechRecognition.start({\n          language: langRef.current === 'en' ? 'en-IN' : 'hi-IN',\n          maxResults: 3,\n          prompt: '',\n          partialResults: true,\n          popup: false,\n        });\"

          new_block = \"        const handleTranscripts = (matches: string[]) => {\n          if (!matches.length) return;\n          let supplierMatched = false;\n          for (const transcript of matches) {\n            const code = parseSupplierCommand(transcript, totalSuppliersRef.current);\n            if (code !== null) {\n              supplierCbRef.current?.(code);\n              setError(null);\n              supplierMatched = true;\n              break;\n            }\n          }\n          if (supplierMatched) return;\n          for (const transcript of matches) {\n            const value = parseSpokenNumber(transcript);\n            if (value !== null) {\n              fire(value);\n              break;\n            }\n          }\n        };\n\n        const startNativeSession = () => {\n          NativeSpeechRecognition.start({\n            language: langRef.current === 'en' ? 'en-IN' : 'hi-IN',\n            maxResults: 5,\n            prompt: '',\n            partialResults: true,\n            popup: false,\n            allowForSilence: 2500,\n          } as any).catch(() => {\n            if (wantRef.current) {\n              setTimeout(startNativeSession, 150);\n            }\n          });\n        };\n\n        await NativeSpeechRecognition.addListener('partialResults', (data: { matches?: string[] }) => {\n          handleTranscripts(data.matches || []);\n        });\n\n        await NativeSpeechRecognition.addListener('segmentResults', (data: { matches?: string[] }) => {\n          handleTranscripts(data.matches || []);\n        });\n\n        await NativeSpeechRecognition.addListener('listeningState', (data: { status?: string }) => {\n          if (data && data.status === 'stopped' && wantRef.current) {\n            startNativeSession();\n          }\n        });\n\n        startNativeSession();\"

          assert old_block in content, 'main block not found'
          content = content.replace(old_block, new_block, 1)
          f = open(path, 'w'); f.write(content); f.close()
          print('capgo migration applied')
          "

      - name: Auto-enable Bluetooth before printer connect
        run: |
          python3 -c "
          path = 'dairyfuture-main/src/lib/thermalPrinter.ts'
          f = open(path); content = f.read(); f.close()
          old = 'await BleClient.initialize();'
          new = old + \"\n      try {\n        const btEnabled = await BleClient.isEnabled();\n        if (!btEnabled) {\n          await BleClient.requestEnable();\n        }\n      } catch (e) {\n        console.warn('Bluetooth enable prompt failed', e);\n      }\"
          content = content.replace(old, new, 1)
          f = open(path, 'w'); f.write(content); f.close()
          "

      - name: Add native Downloads saver plugin (Java)
        run: |
          cat > dairyfuture-main/android/app/src/main/java/com/dairyfuture/admin/DownloadsPlugin.java <<'EOF'
          package com.dairyfuture.admin;

          import android.content.ContentResolver;
          import android.content.ContentValues;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;

          @CapacitorPlugin(name = "DownloadsSaver")
          public class DownloadsPlugin extends Plugin {

              @PluginMethod
              public void savePdf(PluginCall call) {
                  String filename = call.getString("filename");
                  String base64 = call.getString("base64");
                  if (filename == null || filename.isEmpty() || base64 == null || base64.isEmpty()) {
                      call.reject("filename and base64 are required");
                      return;
                  }
                  try {
                      byte[] bytes = Base64.decode(base64, Base64.DEFAULT);
                      String location;
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          ContentResolver resolver = getContext().getContentResolver();
                          ContentValues values = new ContentValues();
                          values.put(MediaStore.MediaColumns.DISPLAY_NAME, filename);
                          values.put(MediaStore.MediaColumns.MIME_TYPE, "application/pdf");
                          values.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                          Uri uri = resolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                          if (uri == null) {
                              call.reject("Could not create file in Downloads");
                              return;
                          }
                          OutputStream os = resolver.openOutputStream(uri);
                          if (os == null) {
                              call.reject("Could not open Downloads file");
                              return;
                          }
                          try {
                              os.write(bytes);
                              os.flush();
                          } finally {
                              os.close();
                          }
                          location = "Downloads/" + filename;
                      } else {
                          File dir = getContext().getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS);
                          if (dir == null) {
                              call.reject("Storage not available");
                              return;
                          }
                          if (!dir.exists()) {
                              dir.mkdirs();
                          }
                          File out = new File(dir, filename);
                          FileOutputStream fos = new FileOutputStream(out);
                          try {
                              fos.write(bytes);
                              fos.flush();
                          } finally {
                              fos.close();
                          }
                          location = out.getAbsolutePath();
                      }
                      JSObject ret = new JSObject();
                      ret.put("saved", true);
                      ret.put("location", location);
                      call.resolve(ret);
                  } catch (Exception e) {
                      call.reject("Save failed: " + e.getMessage());
                  }
              }
          }
          EOF

      - name: Register DownloadsPlugin in MainActivity
        run: |
          sed -i 's/registerPlugin(AdminNotificationPlugin.class);/registerPlugin(AdminNotificationPlugin.class);\n        registerPlugin(DownloadsPlugin.class);/' dairyfuture-main/android/app/src/main/java/com/dairyfuture/admin/MainActivity.java
          grep -q "DownloadsPlugin.class" dairyfuture-main/android/app/src/main/java/com/dairyfuture/admin/MainActivity.java

      - name: Add native PDF helper and wire it into PDF export screens
        run: |
          cat > dairyfuture-main/src/lib/nativePdf.ts <<'EOF'
          import { Capacitor, registerPlugin } from '@capacitor/core';

          interface DownloadsSaverPlugin {
            savePdf(options: { filename: string; base64: string }): Promise<{ saved: boolean; location: string }>;
          }

          const DownloadsSaver = registerPlugin<DownloadsSaverPlugin>('DownloadsSaver');

          export async function downloadPdfNative(doc: any, filename: string): Promise<boolean> {
            if (Capacitor.isNativePlatform()) {
              try {
                const dataUri: string = doc.output('datauristring');
                const base64 = dataUri.split(',')[1];
                await DownloadsSaver.savePdf({ filename, base64 });
                return true;
              } catch (e) {
                console.error('Native PDF save failed:', e);
                return false;
              }
            }
            try {
              const pdfDataUri: string = doc.output('datauristring');
              const link = document.createElement('a');
              link.href = pdfDataUri;
              link.download = filename;
              link.style.display = 'none';
              document.body.appendChild(link);
              link.click();
              setTimeout(() => document.body.removeChild(link), 500);
              return true;
            } catch (e) {
              console.error('PDF download failed:', e);
              return false;
            }
          }
          EOF

          cat > /tmp/patch_pdf.py <<'EOF'
          import re

          path = 'dairyfuture-main/src/utils/exportData.ts'
          content = open(path).read()
          content = content.replace("import jsPDF from 'jspdf';", "import jsPDF from 'jspdf';\nimport { downloadPdfNative } from '@/lib/nativePdf';", 1)
          start_idx = content.index('// Safe PDF download using data URI')
          end_idx = content.index('export const exportToPDF = (')
          new_fn = (
              "// Native app: save directly to Downloads. Web: normal browser download.\n"
              "const safePDFDownload = (doc: jsPDF, filename: string) => {\n"
              "  void downloadPdfNative(doc, filename);\n"
              "};\n\n"
          )
          content = content[:start_idx] + new_fn + content[end_idx:]
          open(path, 'w').write(content)

          path2 = 'dairyfuture-main/src/components/ReportReceipt.tsx'
          c2 = open(path2).read()
          c2 = c2.replace("import jsPDF from 'jspdf';", "import jsPDF from 'jspdf';\nimport { downloadPdfNative } from '@/lib/nativePdf';", 1)
          pattern = re.compile(r"      const pdfDataUri = doc\.output\('datauristring'\);.*?setTimeout\(\(\) => \{ document\.body\.removeChild\(link\); \}, 100\);", re.S)
          replacement = "      void downloadPdfNative(doc, `Milk_Report_${data.supplierCode}_${data.startDate.replace(/-/g, '_')}.pdf`);"
          c2, n = pattern.subn(lambda m: replacement, c2, count=1)
          assert n == 1, 'ReportReceipt PDF block not found'
          open(path2, 'w').write(c2)
          print('pdf patch applied')
          EOF
          python3 /tmp/patch_pdf.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        working-directory: dairyfuture-main
        run: npm install --legacy-peer-deps

      - name: Swap speech recognition plugin
        working-directory: dairyfuture-main
        run: |
          npm uninstall @capacitor-community/speech-recognition --legacy-peer-deps
          npm install @capgo/capacitor-speech-recognition --legacy-peer-deps

      - name: Set app name to DairyFuture
        run: |
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">DairyFuture<\/string>/' dairyfuture-main/android/app/src/main/res/values/strings.xml
          sed -i 's/<string name="title_activity_main">.*<\/string>/<string name="title_activity_main">DairyFuture<\/string>/' dairyfuture-main/android/app/src/main/res/values/strings.xml

      - name: Prepare app icon from PWA icon
        run: |
          sudo apt-get update -qq && sudo apt-get install -y imagemagick
          mkdir -p dairyfuture-main/assets
          convert dairyfuture-main/public/icon-512.png -fuzz 8% -trim +repage -resize 1024x1024 -background white -gravity center -extent 1024x1024 dairyfuture-main/assets/icon.png

      - name: Generate Android icons from PWA icon
        working-directory: dairyfuture-main
        run: |
          npm install -D @capacitor/assets --legacy-peer-deps
          npx capacitor-assets generate --android

      - name: Build web app
        working-directory: dairyfuture-main
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://nvfdwrabzgsbrjhnboyp.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im52ZmR3cmFiemdzYnJqaG5ib3lwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ3MDQyOTIsImV4cCI6MjA5MDI4MDI5Mn0.AXEJMv8a8qF2Kl0AOCBQfQ2iB5lwJUDVwI-nQrahcI0

      - name: Sync Capacitor Android
        working-directory: dairyfuture-main
        run: npx cap sync android

      - name: Build debug APK
        working-directory: dairyfuture-main/android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dairyfuture-admin-apk
          path: dairyfuture-main/android/app/build/outputs/apk/debug/app-debug.apk
