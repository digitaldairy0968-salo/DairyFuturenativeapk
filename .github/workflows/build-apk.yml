name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o dairyfuture-admin-android-ready.zip -d .

      - name: Fix PaymentSmsReceiver context bug
        run: |
          sed -i 's/SharedPreferences prefs = getSharedPreferences(/SharedPreferences prefs = context.getSharedPreferences(/' dairyfuture-main/android/app/src/main/java/com/dairyfuture/admin/PaymentSmsReceiver.java

      - name: Add Google OAuth deep link intent filter
        run: |
          sed -i '/<\/activity>/i\
            <intent-filter>\
                <action android:name="android.intent.action.VIEW" />\
                <category android:name="android.intent.category.DEFAULT" />\
                <category android:name="android.intent.category.BROWSABLE" />\
                <data android:scheme="com.dairyfuture.app" />\
            </intent-filter>' dairyfuture-main/android/app/src/main/AndroidManifest.xml

      - name: Fix voice entry permission API
        run: |
          sed -i "s/NativeSpeechRecognition\.hasPermissions()/NativeSpeechRecognition.checkPermissions()/" dairyfuture-main/src/hooks/useVoiceEntry.ts
          sed -i "s/if (!hasPerm?\.speechRecognition) {/if (hasPerm?.speechRecognition !== 'granted') {/" dairyfuture-main/src/hooks/useVoiceEntry.ts
          sed -i "s/if (!req?\.speechRecognition) {/if (req?.speechRecognition !== 'granted') {/" dairyfuture-main/src/hooks/useVoiceEntry.ts

      - name: Fix voice entry continuous listening on native
        run: |
          python3 - <<'PYEOF'
          path = "dairyfuture-main/src/hooks/useVoiceEntry.ts"
          with open(path) as f:
              content = f.read()
          old = """        await NativeSpeechRecognition.start({
          language: langRef.current === 'en' ? 'en-IN' : 'hi-IN',
          maxResults: 3,
          prompt: '',
          partialResults: true,
          popup: false,
        });"""
          new = """        const startNativeSession = () => {
          NativeSpeechRecognition.start({
            language: langRef.current === 'en' ? 'en-IN' : 'hi-IN',
            maxResults: 3,
            prompt: '',
            partialResults: true,
            popup: false,
          }).catch(() => {});
        };

        await NativeSpeechRecognition.addListener('listeningState', (data: { status?: string }) => {
          if (data?.status === 'stopped' && wantRef.current) {
            if (restartTimerRef.current) clearTimeout(restartTimerRef.current);
            restartTimerRef.current = setTimeout(startNativeSession, 60);
          }
        });

        startNativeSession();"""
          if old not in content:
              raise SystemExit("pattern not found - aborting to avoid silent no-op")
          content = content.replace(old, new, 1)
          with open(path, 'w') as f:
              f.write(content)
          print("voice continuous-listening patch applied")
          PYEOF

      - name: Auto-enable Bluetooth before printer connect
        run: |
          python3 - <<'PYEOF'
          path = "dairyfuture-main/src/lib/thermalPrinter.ts"
          with open(path) as f:
              content = f.read()
          old = "await BleClient.initialize();"
          new = old + "\n      try {\n        const btEnabled = await BleClient.isEnabled();\n        if (!btEnabled) {\n          await BleClient.requestEnable();\n        }\n      } catch (e) {\n        console.warn('Bluetooth enable prompt failed', e);\n      }"
          content = content.replace(old, new, 1)
          with open(path, 'w') as f:
              f.write(content)
          PYEOF

      - name: Add native PDF save/share support
        run: |
          python3 - <<'PYEOF'
          helper = '''import jsPDF from 'jspdf';
          import { Capacitor } from '@capacitor/core';
          import { Filesystem, Directory } from '@capacitor/filesystem';
          import { Share } from '@capacitor/share';

          export async function downloadPdfNative(doc: jsPDF, filename: string): Promise<void> {
            if (Capacitor.isNativePlatform()) {
              try {
                const dataUri = doc.output('datauristring');
                const base64 = dataUri.split(',')[1];
                const result = await Filesystem.writeFile({
                  path: filename,
                  data: base64,
                  directory: Directory.Documents,
                  recursive: true,
                });
                await Share.share({
                  title: filename,
                  url: result.uri,
                  dialogTitle: 'PDF सेव / शेयर करें',
                });
                return;
              } catch (e) {
                console.error('Native PDF save failed, falling back:', e);
              }
            }
            try {
              const pdfDataUri = doc.output('datauristring');
              const link = document.createElement('a');
              link.href = pdfDataUri;
              link.download = filename;
              link.style.display = 'none';
              document.body.appendChild(link);
              link.click();
              setTimeout(() => document.body.removeChild(link), 500);
            } catch (e) {
              console.error('PDF download failed:', e);
            }
          }
          '''
          with open('dairyfuture-main/src/lib/nativePdf.ts', 'w') as f:
              f.write(helper)

          path = 'dairyfuture-main/src/utils/exportData.ts'
          with open(path) as f:
              content = f.read()
          content = content.replace(
              "import jsPDF from 'jspdf';",
              "import jsPDF from 'jspdf';\nimport { downloadPdfNative } from '@/lib/nativePdf';",
              1
          )
          start_marker = "// Safe PDF download using data URI + hidden anchor (works in sandbox/mobile/APK)\nconst safePDFDownload = (doc: jsPDF, filename: string) => {"
          end_marker = "export const exportToPDF = ("
          start_idx = content.index(start_marker)
          end_idx = content.index(end_marker)
          new_fn = "// Native app me device storage + share sheet, web me normal browser download\nconst safePDFDownload = (doc: jsPDF, filename: string) => {\n  void downloadPdfNative(doc, filename);\n};\n\n"
          content = content[:start_idx] + new_fn + content[end_idx:]
          with open(path, 'w') as f:
              f.write(content)

          path2 = 'dairyfuture-main/src/components/ReportReceipt.tsx'
          with open(path2) as f:
              content2 = f.read()
          lines = content2.split('\n', 1)
          content2 = lines[0] + "\nimport { downloadPdfNative } from '@/lib/nativePdf';" + '\n' + lines[1]
          old_block = """      const pdfDataUri = doc.output('datauristring');
                const link = document.createElement('a');
                link.href = pdfDataUri;
                link.download = `Milk_Report_${data.supplierCode}_${data.startDate.replace(/-/g, '_')}.pdf`;
                link.target = '_blank';
                link.rel = 'noopener';
                link.style.display = 'none';
                document.body.appendChild(link);
                link.click();
                setTimeout(() => { document.body.removeChild(link); }, 100);"""
          new_block = "      void downloadPdfNative(doc, `Milk_Report_${data.supplierCode}_${data.startDate.replace(/-/g, '_')}.pdf`);"
          content2 = content2.replace(old_block, new_block, 1)
          with open(path2, 'w') as f:
              f.write(content2)
          print("done")
          PYEOF

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        working-directory: dairyfuture-main
        run: npm install --legacy-peer-deps

      - name: Install native PDF save plugins
        working-directory: dairyfuture-main
        run: npm install @capacitor/filesystem @capacitor/share --legacy-peer-deps

      - name: Set app name to DairyFuture
        run: |
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">DairyFuture<\/string>/' dairyfuture-main/android/app/src/main/res/values/strings.xml
          sed -i 's/<string name="title_activity_main">.*<\/string>/<string name="title_activity_main">DairyFuture<\/string>/' dairyfuture-main/android/app/src/main/res/values/strings.xml

      - name: Prepare app icon from PWA icon
        run: |
          sudo apt-get update -qq && sudo apt-get install -y imagemagick
          mkdir -p dairyfuture-main/assets
          convert dairyfuture-main/public/icon-512.png -resize 1000x1000 -background white -gravity center -extent 1024x1024 dairyfuture-main/assets/icon.png

      - name: Generate Android icons from PWA icon
        working-directory: dairyfuture-main
        run: |
          npm install -D @capacitor/assets --legacy-peer-deps
          npx capacitor-assets generate --android

      - name: Build web app
        working-directory: dairyfuture-main
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://nvfdwrabzgsbrjhnboyp.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im52ZmR3cmFiemdzYnJqaG5ib3lwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ3MDQyOTIsImV4cCI6MjA5MDI4MDI5Mn0.AXEJMv8a8qF2Kl0AOCBQfQ2iB5lwJUDVwI-nQrahcI0

      - name: Sync Capacitor Android
        working-directory: dairyfuture-main
        run: npx cap sync android

      - name: Build debug APK
        working-directory: dairyfuture-main/android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dairyfuture-admin-apk
          path: dairyfuture-main/android/app/build/outputs/apk/debug/app-debug.apk
